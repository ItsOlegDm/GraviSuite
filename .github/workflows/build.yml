name: Build

# Every push / PR builds the mod and uploads the jar as a workflow artifact.
# Pushing a tag like "4.0.0" (or "release/4.0.0+2.10.33-ex120" to pick the IC2 version)
# also publishes a GitHub Release with the jar attached.
on:
  push:
    branches: ["**"]
    tags:
      - "release/*"
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: versions
        run: |
          mod_id="$(grep '^mod_id=' gradle.properties | cut -d= -f2)"
          mod_version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          ic2_version="$(grep '^ic2_version=' gradle.properties | cut -d= -f2)"
          is_release=false

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            is_release=true
            if [[ "$tag" == release/* ]]; then
              payload="${tag#release/}"
              mod_version="${payload%%+*}"
              ic2_version="${payload#*+}"
              if [[ -z "$mod_version" || -z "$ic2_version" || "$mod_version" == "$payload" ]]; then
                echo "::error::Tag payload must be <mod_version>+<ic2_version>, got: $payload"
                exit 1
              fi
            else
              mod_version="$tag"
            fi
          fi

          echo "mod_id=$mod_id" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "ic2_version=$ic2_version" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache IC2 dev jar
        id: ic2-cache
        uses: actions/cache@v4
        with:
          path: libs/ic2-forge-${{ steps.versions.outputs.ic2_version }}-dev.jar
          key: ic2-dev-${{ steps.versions.outputs.ic2_version }}

      - name: Build IC2 dependency
        if: steps.ic2-cache.outputs.cache-hit != 'true'
        run: |
          ic2_version="${{ steps.versions.outputs.ic2_version }}"
          git clone --depth 1 --branch "$ic2_version" https://github.com/craftorio/ic2.git ../ic2
          cd ../ic2
          chmod +x gradlew
          ./gradlew build --no-daemon -x test
          cd "$GITHUB_WORKSPACE"
          mkdir -p libs
          jar cf "libs/ic2-forge-${ic2_version}-dev.jar" \
            -C ../ic2/build/classes/java/main . \
            -C ../ic2/build/resources/main .

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon \
            -Pmod_version="${{ steps.versions.outputs.mod_version }}" \
            -Pic2_version="${{ steps.versions.outputs.ic2_version }}"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versions.outputs.mod_id }}-${{ steps.versions.outputs.mod_version }}-${{ steps.versions.outputs.minecraft_version }}
          path: build/libs/${{ steps.versions.outputs.mod_id }}-${{ steps.versions.outputs.mod_version }}-${{ steps.versions.outputs.minecraft_version }}.jar

      - name: Publish GitHub Release
        if: steps.versions.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Gravitation Suite ${{ steps.versions.outputs.mod_version }} (IC2 ${{ steps.versions.outputs.ic2_version }})
          body: |
            Mod version: `${{ steps.versions.outputs.mod_version }}`
            Minecraft: `${{ steps.versions.outputs.minecraft_version }}` (Forge)
            IC2: Refactored: `${{ steps.versions.outputs.ic2_version }}` or newer
          files: build/libs/${{ steps.versions.outputs.mod_id }}-${{ steps.versions.outputs.mod_version }}-${{ steps.versions.outputs.minecraft_version }}.jar
          generate_release_notes: true
